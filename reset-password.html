<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Abhi Collection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f5;

            font-family: Arial, sans-serif;

        }

        .reset-box {

            width: 90%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);

        }

        h1 {

            text-align: center;

            margin-bottom: 10px;

        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #333;

        }

        button:disabled {

            background: #999;

            cursor: not-allowed;

        }

        #message {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;

        }

        .hidden {

            display: none;

        }

    </style>

</head>


<body>


    <div class="reset-box">

        <h1>ABHI COLLECTION</h1>

        <p class="subtitle">
            Create your new admin password
        </p>


        <form id="resetForm" class="hidden">


            <label for="newPassword">
                New Password
            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="updateButton">

                Update Password

            </button>


        </form>


        <p id="message">
            Verifying password reset link...
        </p>


    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>


        const resetForm =
            document.getElementById("resetForm");


        const message =
            document.getElementById("message");


        const updateButton =
            document.getElementById("updateButton");


        let recoverySessionReady = false;


        /*
        ==========================================
        SUPABASE PASSWORD RECOVERY
        ==========================================
        */


        supabaseClient.auth.onAuthStateChange(
            async function(event, session) {


                console.log(
                    "Supabase Auth Event:",
                    event
                );


                /*
                ------------------------------------------
                PASSWORD RECOVERY EVENT
                ------------------------------------------
                */


                if (
                    event === "PASSWORD_RECOVERY"
                    && session
                ) {


                    recoverySessionReady = true;


                    message.textContent =
                        "You can now create your new password.";


                    message.style.color =
                        "green";


                    resetForm.classList.remove(
                        "hidden"
                    );


                    return;

                }


                /*
                ------------------------------------------
                INITIAL SESSION
                ------------------------------------------
                */


                if (
                    event === "INITIAL_SESSION"
                ) {


                    if (session) {

                        console.log(
                            "Session found."
                        );

                    }


                }


            }
        );


        /*
        ==========================================
        CHECK EXISTING SESSION
        ==========================================
        */


        async function checkSession() {


            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(error);

                message.textContent =
                    "Unable to verify reset link.";

                message.style.color =
                    "red";

                return;

            }


            /*
            If a valid session already exists,
            allow password change.
            */


            if (
                data.session
                && !recoverySessionReady
            ) {


                recoverySessionReady = true;


                message.textContent =
                    "You can now create your new password.";


                message.style.color =
                    "green";


                resetForm.classList.remove(
                    "hidden"
                );

            }

        }


        checkSession();


        /*
        ==========================================
        UPDATE PASSWORD
        ==========================================
        */


        resetForm.addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                if (!recoverySessionReady) {


                    message.textContent =
                        "Password reset session is not ready. Please open the reset link from your email again.";


                    message.style.color =
                        "red";


                    return;

                }


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                /*
                ------------------------------------------
                CHECK PASSWORDS
                ------------------------------------------
                */


                if (
                    newPassword !==
                    confirmPassword
                ) {


                    message.textContent =
                        "Passwords do not match.";


                    message.style.color =
                        "red";


                    return;

                }


                /*
                ------------------------------------------
                PASSWORD LENGTH
                ------------------------------------------
                */


                if (
                    newPassword.length < 6
                ) {


                    message.textContent =
                        "Password must be at least 6 characters.";


                    message.style.color =
                        "red";


                    return;

                }


                /*
                ------------------------------------------
                UPDATE PASSWORD
                ------------------------------------------
                */


                updateButton.disabled =
                    true;


                updateButton.textContent =
                    "Updating...";


                message.textContent =
                    "Updating your password...";


                message.style.color =
                    "#333";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.updateUser({

                        password:
                            newPassword

                    });


                /*
                ------------------------------------------
                ERROR
                ------------------------------------------
                */


                if (error) {


                    console.error(
                        "Password update error:",
                        error
                    );


                    message.textContent =
                        "Failed to update password: "
                        + error.message;


                    message.style.color =
                        "red";


                    updateButton.disabled =
                        false;


                    updateButton.textContent =
                        "Update Password";


                    return;

                }


                /*
                ------------------------------------------
                SUCCESS
                ------------------------------------------
                */


                message.textContent =
                    "Password updated successfully!";


                message.style.color =
                    "green";


                resetForm.reset();


                updateButton.disabled =
                    true;


                updateButton.textContent =
                    "Password Updated";


                /*
                ------------------------------------------
                GO BACK TO ADMIN LOGIN
                ------------------------------------------
                */


                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    2000
                );


            }
        );


    </script>


</body>

</html>
