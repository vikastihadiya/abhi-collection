<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Abhi Collection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .reset-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <h1>ABHI COLLECTION</h1>

        <p class="subtitle">
            Create your new admin password
        </p>

        <form id="resetForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                minlength="6"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>

        const resetForm =
            document.getElementById("resetForm");

        const message =
            document.getElementById("message");

        resetForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }

            message.textContent =
                "Updating password...";

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: newPassword
                });

            if (error) {

                console.error(error);

                message.textContent =
                    "Failed to update password: " +
                    error.message;

                return;
            }

            message.textContent =
                "Password updated successfully!";

            resetForm.reset();

            setTimeout(function() {

                window.location.href =
                    "admin.html";

            }, 2000);

        });

    </script>

</body>

</html>
